<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilváltás</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #FFFDF5;
            --bg-gradient-end: #FEF3C7;
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-main: #292524;
            --text-muted: #78716C;
            --accent-work: #F59E0B;
            --accent-work-hover: #D97706;
            --accent-private-bg: #FEF9C3;
            --accent-private-border: #FDE047;
            --accent-private-hover: #FEF08A;
            --shadow-soft: 0 20px 40px -15px rgba(217, 119, 6, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 224, 71, 0.6);
            border-radius: 28px;
            padding: 36px 28px;
            box-shadow: var(--shadow-soft);
            text-align: center;
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #FEF3C7;
            color: #B45309;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background-color: #F59E0B;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .profile-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 18px 22px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .profile-btn:active {
            transform: scale(0.97);
        }

        /* Munka gomb */
        .btn-work {
            background-color: var(--accent-work);
            color: #FFFFFF;
            box-shadow: 0 8px 20px -6px rgba(245, 158, 11, 0.55);
        }

        .btn-work:hover {
            background-color: var(--accent-work-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(217, 119, 6, 0.6);
        }

        /* Magán gomb */
        .btn-private {
            background-color: var(--accent-private-bg);
            color: var(--text-main);
            border: 1.5px solid var(--accent-private-border);
        }

        .btn-private:hover {
            background-color: var(--accent-private-hover);
            transform: translateY(-2px);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-work .icon-box {
            background-color: rgba(255, 255, 255, 0.22);
        }

        .btn-private .icon-box {
            background-color: #FDE047;
            color: #854D0E;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .btn-title {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .btn-desc {
            font-size: 0.78rem;
            font-weight: 400;
            opacity: 0.85;
            margin-top: 2px;
        }

        .arrow {
            transition: transform 0.2s ease;
            opacity: 0.85;
        }

        .profile-btn:hover .arrow {
            transform: translateX(4px);
        }

        .footer-note {
            margin-top: 26px;
            font-size: 0.75rem;
            color: #A8A29E;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="badge">
            <span class="badge-dot"></span>
            NFC Profilválasztó
        </div>

        <h1>Profilváltás</h1>
        <p class="subtitle">Válaszd ki, melyik névjegyet szeretnéd megnyitni</p>

        <div class="button-group">
            <!-- 1. Munka profil -->
            <a href="https://bajtaib.github.io/BB/" class="profile-btn btn-work">
                <div class="btn-left">
                    <div class="icon-box">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                    </div>
                    <div class="btn-text">
                        <span class="btn-title">Munka</span>
                        <span class="btn-desc">Hivatalos elérhetőségek</span>
                    </div>
                </div>
                <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>

            <!-- 2. Magán profil -->
            <a href="https://bajtaib.github.io/orsi/" class="profile-btn btn-private">
                <div class="btn-left">
                    <div class="icon-box">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="btn-text">
                        <span class="btn-title">Magán</span>
                        <span class="btn-desc">Személyes profil</span>
                    </div>
                </div>
                <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        </div>

        <div class="footer-note">Érintsd meg a kívánt profilt a folytatáshoz</div>
    </main>

</body>
</html>
